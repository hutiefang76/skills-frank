# Frank 公开 skills 清单
# 此文件随 frank 二进制一起分发, 描述所有"公开 + 自研开源"的 skills。
# 公司专属 skills 不在此文件 — 放 ~/.frank/manifests/private-*.yaml (本地)。
#
# schema 详见 docs/DESIGN.md §7.1

schema_version: 1
profile: personal

skills:
  # ===== 公共 skills (上游 anthropics 等) =====

  - name: skill-creator
    description: 创建/迭代新 skill 的元 skill
    source:
      type: git
      url: https://github.com/anthropics/skill-creator.git
    visibility: public
    target_platforms: [claude, codex, opencode]

  - name: superpowers
    description: 通用编程超能力 (TDD/debug/brainstorming)
    source:
      type: git
      url: https://github.com/anthropics/claude-superpowers.git
    visibility: public
    target_platforms: [claude]

  # ===== 自研开源 skills (hutiefang76) =====

  - name: doris-ops
    description: TCHouse-D (Doris) 运维 (查表/性能/扩容)
    source:
      type: git
      url: https://github.com/hutiefang76/skills-doris-ops.git
    visibility: own-public
    dependencies:
      python: ["mysql-connector-python>=8.0"]
    health_check:
      cmd: "python -c 'import mysql.connector'"
      timeout_seconds: 5

  - name: feishu-read
    description: 飞书文档/表格/Excel/PDF 提取
    source:
      type: git
      url: https://github.com/hutiefang76/skills-feishu-read.git
    visibility: own-public
    dependencies:
      python: ["pdfplumber", "openpyxl"]

  - name: nacos-config
    description: Nacos 配置中心查询/修改
    source:
      type: git
      url: https://github.com/hutiefang76/skills-nacos-config.git
    visibility: own-public

  - name: dolphinscheduler-ops
    description: DolphinScheduler 任务运维 (查询/重跑/暂停)
    source:
      type: git
      url: https://github.com/hutiefang76/skills-dolphinscheduler-ops.git
    visibility: own-public

  - name: streampark-ops
    description: StreamPark Flink 作业管理 (提交/启停/查日志)
    source:
      type: git
      url: https://github.com/hutiefang76/skills-streampark-ops.git
    visibility: own-public
