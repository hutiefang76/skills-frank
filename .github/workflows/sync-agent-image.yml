name: sync-agent docker image

# 单独 workflow, 不与 release.yml 耦合 — sync-agent 镜像跟 frank-cli binary 发版节奏可以错开.
#
# 触发:
#   - push 到 main 改了 frank-sync-agent / frank-memory / Dockerfile 时
#   - 手动 workflow_dispatch (随时手动 build 最新)
#   - tag v*.*.* (跟 frank-cli release 同步打一份带版本号镜像)
#
# 产出: ghcr.io/${{ github.repository_owner }}/frank-sync-agent
#   - :latest (push to main 后)
#   - :sha-<short_sha>
#   - :v0.8.0 (打 tag 时)
#
# 用法 (tx 服务器):
#   echo $GHCR_PAT | docker login ghcr.io -u hutiefang76 --password-stdin
#   docker pull ghcr.io/hutiefang76/frank-sync-agent:latest
#   docker compose up -d sync-agent
#
# 为什么走 GH Actions: mac arm64 用 docker buildx --platform linux/amd64 走 qemu 模拟,
# 网络不稳 (mirror 拉 deps 反复 timeout). GH Actions ubuntu-latest = linux/amd64 native build,
# 网络稳速度快, 0 qemu overhead.

on:
  push:
    branches: [main]
    paths:
      - 'crates/frank-sync-agent/**'
      - 'crates/frank-memory/**'
      - 'deploy/sync-agent.Dockerfile'
      - '.github/workflows/sync-agent-image.yml'
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/frank-sync-agent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write    # 推 ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # v0.8.1: 预下载 fastembed BAAI/bge-small-en-v1.5 ONNX 模型到 hf-hub cache.
      # 后续 docker build COPY 进 runtime image, runtime 不再联网下载.
      # 解决 tx 在国内连 HuggingFace 不稳 (hf-mirror.com 不返 Content-Range header 导致 partial download fail).
      - name: Pre-download fastembed model (HF cache layout)
        run: |
          python3 -m pip install --user --quiet huggingface_hub
          mkdir -p ./hf-cache
          export PATH="$HOME/.local/bin:$PATH"
          HF_HOME=$PWD/hf-cache huggingface-cli download Xenova/bge-small-en-v1.5
          echo "--- cache size ---"
          du -sh ./hf-cache
          ls ./hf-cache/hub/models--Xenova--bge-small-en-v1.5/snapshots/*/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/sync-agent.Dockerfile
          platforms: linux/amd64    # tx 是 x86_64, 不需要 arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
