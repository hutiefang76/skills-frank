name: sync-agent docker image

# 单独 workflow, 不与 release.yml 耦合 — sync-agent 镜像跟 frank-cli binary 发版节奏可以错开.
#
# 触发:
#   - push 到 main 改了 frank-sync-agent / frank-memory / Dockerfile 时
#   - 手动 workflow_dispatch (随时手动 build 最新)
#   - tag v*.*.* (跟 frank-cli release 同步打一份带版本号镜像)
#
# 产出: ghcr.io/${{ github.repository_owner }}/frank-sync-agent
#   - :latest (push to main 后)
#   - :sha-<short_sha>
#   - :v0.8.0 (打 tag 时)
#
# 用法 (tx 服务器):
#   echo $GHCR_PAT | docker login ghcr.io -u hutiefang76 --password-stdin
#   docker pull ghcr.io/hutiefang76/frank-sync-agent:latest
#   docker compose up -d sync-agent
#
# 为什么走 GH Actions: mac arm64 用 docker buildx --platform linux/amd64 走 qemu 模拟,
# 网络不稳 (mirror 拉 deps 反复 timeout). GH Actions ubuntu-latest = linux/amd64 native build,
# 网络稳速度快, 0 qemu overhead.

on:
  push:
    branches: [main]
    paths:
      - 'crates/frank-sync-agent/**'
      - 'crates/frank-memory/**'
      - 'deploy/sync-agent.Dockerfile'
      - '.github/workflows/sync-agent-image.yml'
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: '附加 docker tar.gz 到现有 release tag (例: v0.10.10). 留空则不上传.'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/frank-sync-agent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # v0.10.11: 上传 docker tar.gz 到 GitHub Release 需 write
      packages: write    # 推 ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # v0.10.10: 模型从镜像移到 host volume, CI 不再预下 (省 ~250MB build context + 1-2min CI).
      # tx 上首次部署跑 deploy/scripts/init-models.sh 把模型下到 /opt/frank/models.
      # 之前 (v0.8.1 - v0.10.9) 把模型 COPY 进 image, 镜像 572MB, tx pull 经常 timeout.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/sync-agent.Dockerfile
          platforms: linux/amd64    # tx 是 x86_64, 不需要 arm64
          push: true
          load: false               # 多平台不支持 push+load, 我们后面单独 pull
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # v0.10.11: 把 image 保存成 tar.gz, 上传到 GitHub Release.
      # 国内 (tx) 拉 ghcr.io 经常 timeout, 走 release CDN 通常很稳.
      # 仅在 tag push 或 workflow_dispatch + release_tag 时上传 (避免 main push 每次都传).
      - name: Determine release tag
        id: reltag
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "==> 将上传到 release: $TAG"

      - name: Save image as tar.gz
        if: steps.reltag.outputs.tag != ''
        run: |
          set -e
          TAG="${{ steps.reltag.outputs.tag }}"
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
          echo "==> pull $IMG"
          docker pull "$IMG"
          mkdir -p dist
          OUT="dist/frank-sync-agent-${TAG}-linux-amd64.tar.gz"
          echo "==> save to $OUT"
          docker save "$IMG" | gzip > "$OUT"
          ls -lh "$OUT"
          shasum -a 256 "$OUT" > "$OUT.sha256"
          cat "$OUT.sha256"

      - name: Upload tar.gz to GitHub Release
        if: steps.reltag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.reltag.outputs.tag }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
          fail_on_unmatched_files: true
