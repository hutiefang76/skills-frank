name: sync-agent docker image

# 单独 workflow, 不与 release.yml 耦合 — sync-agent 镜像跟 frank-cli binary 发版节奏可以错开.
#
# 触发:
#   - push 到 main 改了 frank-sync-agent / frank-memory / Dockerfile 时
#   - 手动 workflow_dispatch (随时手动 build 最新)
#   - tag v*.*.* (跟 frank-cli release 同步打一份带版本号镜像)
#
# 产出: ghcr.io/${{ github.repository_owner }}/frank-sync-agent
#   - :latest (push to main 后)
#   - :sha-<short_sha>
#   - :v0.8.0 (打 tag 时)
#
# 用法 (tx 服务器):
#   echo $GHCR_PAT | docker login ghcr.io -u hutiefang76 --password-stdin
#   docker pull ghcr.io/hutiefang76/frank-sync-agent:latest
#   docker compose up -d sync-agent
#
# 为什么走 GH Actions: mac arm64 用 docker buildx --platform linux/amd64 走 qemu 模拟,
# 网络不稳 (mirror 拉 deps 反复 timeout). GH Actions ubuntu-latest = linux/amd64 native build,
# 网络稳速度快, 0 qemu overhead.

on:
  push:
    branches: [main]
    paths:
      - 'crates/frank-sync-agent/**'
      - 'crates/frank-memory/**'
      - 'deploy/sync-agent.Dockerfile'
      - '.github/workflows/sync-agent-image.yml'
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/frank-sync-agent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write    # 推 ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # v0.10.10: 模型从镜像移到 host volume, CI 不再预下 (省 ~250MB build context + 1-2min CI).
      # tx 上首次部署跑 deploy/scripts/init-models.sh 把模型下到 /opt/frank/models.
      # 之前 (v0.8.1 - v0.10.9) 把模型 COPY 进 image, 镜像 572MB, tx pull 经常 timeout.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/sync-agent.Dockerfile
          platforms: linux/amd64    # tx 是 x86_64, 不需要 arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
