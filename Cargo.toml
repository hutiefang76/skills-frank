# frank — Cargo workspace 根 manifest
#
# 子 crate 都放在 crates/ 下:
#   - frank-cli         CLI 主二进制 (已落地, P0)
#   - frank-memory      分布式记忆 (mem0-同思路 Rust 重表述, P5)
#   - frank-orchestrator 多 Agent 协作总线 (Web UI + API, P6) [待建]
#   - frank-sync-agent  服务端 host: axum REST + WS, 跑在 tx:8317 (P2+P5)

[workspace]
members = ["crates/*"]
resolver = "2"

# ---- 工作区共享元数据 (子 crate 用 `version.workspace = true` 引用) ----
[workspace.package]
version = "0.4.2"
edition = "2021"
rust-version = "1.75"
authors = ["hutiefang <hutiefang@icloud.com>"]
license = "MIT"
repository = "https://github.com/hutiefang76/skills-frank"

# ---- 工作区共享依赖 (子 crate 用 `dep = { workspace = true }` 引用) ----
# 仅放跨多个 crate 出现的依赖, 单 crate 专属的留在 crate 自己的 [dependencies]
[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "fs", "io-util", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
sha2 = "0.10"
tempfile = "3.27"

# ---- 编译配置 (workspace 级生效全部子 crate) ----
[profile.release]
opt-level = "z"      # 体积优先 (frank 不是 CPU 密集, 体积 > 速度)
lto = true           # link-time optimization, 进一步压缩
codegen-units = 1    # 单元更少 = 更激进优化
strip = "symbols"    # 移除符号信息
panic = "abort"      # panic 直接 abort, 不展开栈 (省体积)

[profile.dev]
opt-level = 0        # 开发期不优化, 编译快

# ---- Lint 配置 (子 crate 用 `[lints] workspace = true` 继承) ----
# ADR-001 质量基线: 全 crate 强制 pedantic + missing_docs + forbid unsafe
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# 允许的例外 (pedantic 太学究, 或与中文项目风格冲突)
module_name_repetitions = "allow"
missing_errors_doc = "allow"      # anyhow::Result 不强制 # Errors 节
missing_panics_doc = "allow"
doc_markdown = "allow"            # 中文文档里英文专有名词不强制反引号
default_trait_access = "allow"    # 测试代码 Default::default() 更简洁
must_use_candidate = "allow"      # 不是所有 getter 都要 #[must_use]
needless_pass_by_value = "allow"  # clap Args 按值传符合惯例
items_after_statements = "allow"  # 工具函数可放在 use 之后
unnecessary_wraps = "allow"       # dispatcher 统一返回 Result<()>

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_imports = "warn"
unused_variables = "warn"
