# frank.hutiefang.com — 1Panel openresty 反代到 Caddy(:8318)
#
# 部署路径: /opt/1panel/www/conf.d/frank.hutiefang.com.conf
# 证书:    /etc/letsencrypt/live/frank.hutiefang.com/ (certbot webroot 自动续期)
# webroot: /opt/1panel/apps/openresty/openresty/root/frank.hutiefang.com (ACME 验证)
#
# 流量链: 浏览器 :443 → 1Panel openresty (TLS 终止) → 127.0.0.1:8318 (Caddy 容器)
#         → frank-net (qdrant + sync-agent + 后续 orchestrator-web)

server {
    listen 80;
    listen [::]:80;
    server_name frank.hutiefang.com;

    # Let's Encrypt 续期 webroot
    # 注: nginx 在 1Panel-openresty 容器内运行, root 必须是 *容器内* 路径
    # 宿主机 /opt/1panel/apps/openresty/openresty/root/ → 容器 /usr/share/nginx/html/
    # certbot 写 challenge 文件到宿主机端 (webroot_path), nginx 从容器端读 (此 root)
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html/frank.hutiefang.com;
    }

    # 其余强跳 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name frank.hutiefang.com;

    ssl_certificate     /etc/letsencrypt/live/frank.hutiefang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frank.hutiefang.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 反代到 Caddy (Docker 容器映射到 host:8318)
    location / {
        proxy_pass http://127.0.0.1:8318;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket / SSE 升级 (orchestrator 实时日志流要用)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
