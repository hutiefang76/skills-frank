# frank-stack 服务端栈 (跑在 tx:8318)
#
# 当前包含 (P0 + P2):
#   - caddy:       TLS 终止 + 反向代理 (对外端口 8318 → 容器内 8317)
#   - qdrant:      vector DB, 内部 :6333 / :6334
#   - sync-agent:  frank Rust 服务端 (axum, /memory + /orchestrator), 内部 :3000
#
# 待加 (P6+):
#   - postgres:   orchestrator job 持久化
#
# 资源预算 (tx 总 RAM 3.3G, 可用 ~1G):
#   - caddy:       ~30 MB    (limit 64 MB)
#   - qdrant:      ~120 MB   (limit 256 MB)
#   - sync-agent:  ~50 MB    (limit 128 MB)
#   - 合计预算: < 500 MB
#
# 部署:
#   cd /opt/frank
#   docker compose up -d qdrant && curl -sf http://localhost:6333/healthz
#   docker compose up -d sync-agent && docker logs frank-sync-agent | tail -10
#   docker compose up -d caddy && curl -sf http://localhost:8318/healthz

networks:
  frank-net:
    driver: bridge

volumes:
  qdrant-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
  # v0.10.10: 模型从 host 挂入 sync-agent. host 路径 /opt/frank/models 由
  # deploy/scripts/init-models.sh 一次性下好 (~250MB BGE-small ONNX 权重).
  # 用 bind mount (driver_opts.type=none) 而非 named volume, 方便 host 直接看/管.
  sync-agent-models:
    driver: local
    driver_opts:
      type: none
      device: /opt/frank/models
      o: bind

services:
  qdrant:
    # v0.8: 升 v1.13.0 → v1.18.0 — qdrant-client crate v1.18 要求 server ≥ v1.17 (minor 兼容窗口 1)
    image: qdrant/qdrant:v1.18.0
    container_name: frank-qdrant
    restart: unless-stopped
    expose:
      - "6333"  # HTTP
      - "6334"  # gRPC (Rust SDK 默认用这个)
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
    networks: [frank-net]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  sync-agent:
    # 镜像由本机 docker buildx (linux/amd64) 构建, scp .tar 到 tx, docker load 进来后
    # 直接以 image: 引用; tx 上不重 build (避免 OOM)。
    # 重 build 时本地执行:
    #   docker buildx build --platform linux/amd64 \
    #     -f deploy/sync-agent.Dockerfile \
    #     -t frank-sync-agent:0.1.0 \
    #     --output type=docker,dest=/tmp/frank-sync-agent.tar .
    # v0.8: bump 0.1.0 → 0.8.0, mock 模式默认关 (LocalEmbedder fastembed 384d + Mock 行拆 extractor).
    # 详见 ADR-003: 默认零 token, 不需要 OPENAI/ANTHROPIC key 也能跑.
    # v0.10.10: 从 ghcr.io 拉瘦身镜像 (80MB, 模型走 volume). tx 上跑 docker compose pull.
    image: ghcr.io/hutiefang76/frank-sync-agent:v0.10.10
    container_name: frank-sync-agent
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      # v0.10.10: 模型 host bind mount; 部署前必须先跑 deploy/scripts/init-models.sh
      - sync-agent-models:/home/nobody/.cache/huggingface
    environment:
      FRANK_BIND_ADDR: 0.0.0.0:3000
      FRANK_QDRANT_URL: http://qdrant:6334
      # v0.8: collection 默认 frank_memories_v1 (384 维, LocalEmbedder).
      # 老 mock 用 16 维 _mock_v1, 不能共用 — 切真模式时直接换 collection 名.
      FRANK_COLLECTION: ${FRANK_COLLECTION:-frank_memories_v1}
      # v0.8: mock 默认关. 切 mock 用 docker compose run -e FRANK_MEMORY_MOCK=1 ...
      # 接入云 key (可选, 抽 fact 质量更好):
      #   - OPENAI_API_KEY: 切 OpenAIEmbedder (1536 维, 需换 collection)
      #   - ANTHROPIC_API_KEY: 切 ClaudeExtractor (服务端抽 fact, 现 frank-cli 走客户端抽)
      FRANK_MEMORY_MOCK: ${FRANK_MEMORY_MOCK:-0}
      # HuggingFace 国内镜像 (fastembed 首次下载 ~50MB BGE 模型); hf-mirror.com 是社区维护的 HF 全量镜像
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      RUST_LOG: "info,frank_memory=debug,frank_sync_agent=debug"
    networks: [frank-net]
    depends_on:
      qdrant:
        condition: service_healthy
    # v0.8: 拉高 mem_limit 128m → 512m. fastembed ONNX runtime + BGE 模型加载需 ~300MB
    mem_limit: 512m

  caddy:
    image: caddy:2.10-alpine
    container_name: frank-caddy
    restart: unless-stopped
    ports:
      - "8318:8317"   # 注: 8317 被 cli-proxy-api 占用 (用户既有服务), 暂用 8318
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      # /memory/* /orchestrator/* /qdrant/* 鉴权 token (X-Frank-Token header)
      # 从 host /opt/frank/.secrets/api_token 读 (一次性生成, 600 权限)
      FRANK_API_TOKEN: ${FRANK_API_TOKEN:?set in .env or via 'export FRANK_API_TOKEN=$(cat .secrets/api_token)'}
    networks: [frank-net]
    depends_on:
      qdrant:
        condition: service_healthy
      sync-agent:
        condition: service_started
    mem_limit: 64m
