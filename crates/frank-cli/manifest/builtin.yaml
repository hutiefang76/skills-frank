# Frank 内置 skills 清单 — frank 项目作者 (芳哥 / hutiefang76) 维护
#
# 这个文件随 frank 二进制一起分发, 包含两类:
#
#   1. frank-own            — 芳哥自研开源 skills (装 frank 即拥有)
#   2. frank-recommended    — 芳哥推荐的 upstream / 第三方 skills (一键装)
#
# 用户自己的 skills (无论公司 / 私有 / 开源) **不在此文件** — 放
# ~/.frank/manifests/*.yaml. visibility 用 `user-*` 系列, 那是用户视角的分类
# (跟 frank 项目作者无关). 详见 README "Skills 两层 5 档分类" 一节。
#
# schema 详见 docs/DESIGN.md §7.1

schema_version: 1
profile: personal

skills:
  # ═══════════════════════════════════════════════════════════════
  # frank-recommended — 芳哥推荐 (upstream / 第三方, 装 frank 时一键)
  # ═══════════════════════════════════════════════════════════════

  # ───── frank 自家的 slash 命令 sub-skills (v0.5.2 新增) ─────
  # 触发 /frank:ask:gpt / /frank:mem:list 等 slash. 装到三平台 skills/ 后, Claude
  # Code / codex / opencode 看到 description 就能识别. 内部 shell out 到 `frank`
  # CLI, 所以必须先有 frank binary (brew install hutiefang76/frank/frank).
  #
  # 单 repo skills-frank-bridge 含全 7 个 sub-skill, 用 git+subpath 引用避免发 7 个 repo.

  - name: frank-bridge
    description: AI 之间一问一答桥 (`/frank:<provider> <prompt>` 触发, 转发给目标 CLI)
    source:
      type: git
      url: https://github.com/hutiefang76/skills-frank-bridge.git
      subpath: frank-bridge
    visibility: frank-recommended
    target_platforms: [claude, codex, opencode]

  - name: frank-ask-gpt
    description: 转发给 codex CLI (gpt-5.5 Plus) — `/frank:ask:gpt <prompt>` 或 "问 gpt"
    source:
      type: git
      url: https://github.com/hutiefang76/skills-frank-bridge.git
      subpath: frank-ask-gpt
    visibility: frank-recommended
    target_platforms: [claude, codex, opencode]

  - name: frank-ask-claude
    description: 转发给 claude CLI (Pro/Max 订阅 opus) — `/frank:ask:claude <prompt>`
    source:
      type: git
      url: https://github.com/hutiefang76/skills-frank-bridge.git
      subpath: frank-ask-claude
    visibility: frank-recommended
    target_platforms: [claude, codex, opencode]

  - name: frank-ask-opencode
    description: 转发给 opencode CLI (Go 套餐 qwen3.6+) — `/frank:ask:opencode <prompt>`
    source:
      type: git
      url: https://github.com/hutiefang76/skills-frank-bridge.git
      subpath: frank-ask-opencode
    visibility: frank-recommended
    target_platforms: [claude, codex, opencode]

  - name: frank-ask-gemini
    description: 转发给 gemini CLI (Google) — `/frank:ask:gemini <prompt>`
    source:
      type: git
      url: https://github.com/hutiefang76/skills-frank-bridge.git
      subpath: frank-ask-gemini
    visibility: frank-recommended
    target_platforms: [claude, codex, opencode]

  - name: frank-mem-list
    description: 列出用户分布式记忆 (frank-memory) — `/frank:mem:list`
    source:
      type: git
      url: https://github.com/hutiefang76/skills-frank-bridge.git
      subpath: frank-mem-list
    visibility: frank-recommended
    target_platforms: [claude, codex, opencode]

  - name: frank-mem-search
    description: 语义检索用户分布式记忆 — `/frank:mem:search <query>`
    source:
      type: git
      url: https://github.com/hutiefang76/skills-frank-bridge.git
      subpath: frank-mem-search
    visibility: frank-recommended
    target_platforms: [claude, codex, opencode]

  # ───── upstream / 第三方 (anthropics / open-source) ─────

  - name: skill-creator
    description: 创建/迭代新 skill 的元 skill (anthropics 官方)
    source:
      type: git
      url: https://github.com/anthropics/skill-creator.git
    visibility: frank-recommended
    target_platforms: [claude, codex, opencode]

  - name: superpowers
    description: 通用编程超能力 (TDD/debug/brainstorming, anthropics 官方)
    source:
      type: git
      url: https://github.com/anthropics/claude-superpowers.git
    visibility: frank-recommended
    target_platforms: [claude]

  # ===== frank-recommended MCP (v0.4 新增, 巧妙集成: source.type=mcp 自动写 ~/.claude.json) =====

  - name: mcp-time
    description: 时间/时区 MCP server (anthropics 官方, 跨时区代码 + 日历 必备)
    source:
      type: mcp
      command: npx
      args: ["-y", "@modelcontextprotocol/server-time"]
    visibility: frank-recommended
    target_platforms: [claude, codex]

  - name: mcp-sequential-thinking
    description: 序列化思考 MCP (anthropics 官方, 让 AI 分步推理大问题)
    source:
      type: mcp
      command: npx
      args: ["-y", "@modelcontextprotocol/server-sequential-thinking"]
    visibility: frank-recommended
    target_platforms: [claude, codex]

  - name: mcp-fetch
    description: HTTP fetch MCP (uvx mcp-server-fetch, AI 真能上网拉文档)
    source:
      type: mcp
      command: uvx
      args: ["mcp-server-fetch"]
    visibility: frank-recommended
    target_platforms: [claude, codex]

  - name: mcp-context7
    description: 第三方库文档 MCP (upstash/context7, 实时拉最新 SDK 文档)
    source:
      type: mcp
      command: npx
      args: ["-y", "@upstash/context7-mcp"]
    visibility: frank-recommended
    target_platforms: [claude, codex]

  # ═══════════════════════════════════════════════════════════════
  # frank-own — 芳哥 (hutiefang76) 自研开源 skills
  #
  # 自含原则 (v0.5 加入): 每个 frank-own skill 仓库必须**自带** 全部依赖 + setup
  # 脚本 (Python venv / npm install / 配置模板). frank install 只做"clone +
  # symlink 到 ~/.{claude,codex,opencode}/skills/", **不解析 dependencies**.
  # 这样 skills 跟项目主仓 (skills-frank) 完全解耦, 不会因 kdwl 私有仓 / 内部
  # 工具变化而连带破坏 frank.
  #
  # 用户原话: "frank-skills 只是辅助安装和管理".
  # ═══════════════════════════════════════════════════════════════

  - name: nacos-ops
    description: Nacos 配置中心查询/修改 (用户自己机器跑 — 依赖 mysql-connector-python, setup 见 skill 内 install.sh)
    source:
      type: git
      url: https://github.com/hutiefang76/skills-nacos-ops.git
    visibility: frank-own

  - name: streampark-ops
    description: StreamPark Flink 作业管理 (提交/启停/查日志) — 依赖见 skill 内 SKILL.md
    source:
      type: git
      url: https://github.com/hutiefang76/skills-streampark-ops.git
    visibility: frank-own

