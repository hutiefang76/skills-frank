# Frank 内置 skills 清单 — 编译期 embed 进 binary (frank-cli 项目方维护)
#
# 这个文件随 frank 二进制一起分发, 包含两类 (v0.6 国际化命名):
#
#   1. official   — frank 项目方自研开源 skills (装 frank 即拥有, 例 nacos-ops)
#   2. curated    — frank 项目方精选的 upstream / 第三方 skills (一键装, 例 skill-creator)
#
# 用户自己的 skills (社区/团队/私有) **不在此文件** — 放 ~/.frank/manifests/*.yaml.
# visibility 用 community / team / private (用户视角分类).
#
# 老 v0.5 命名 (frank-own / frank-recommended / user-public / user-company / user-private)
# 通过 #[serde(alias)] 自动兼容, 不破老 manifest. 详见 README "Skills 两层 5 档分类".
#
# schema 详见 docs/DESIGN.md §7.1

schema_version: 1
profile: personal

skills:
  # ═══════════════════════════════════════════════════════════════
  # curated — frank 项目方精选 (upstream / 第三方, 装 frank 时一键)
  # ═══════════════════════════════════════════════════════════════

  # ───── frank 自家的 slash 命令 sub-skills (v0.5.2 新增) ─────
  # 触发 /frank:ask:gpt / /frank:mem:list 等 slash. 装到三平台 skills/ 后, Claude
  # Code / codex / opencode 看到 description 就能识别. 内部 shell out 到 `frank`
  # CLI, 所以必须先有 frank binary (brew install hutiefang76/frank/frank).
  #
  # 单 repo skills-frank-bridge 含全 7 个 sub-skill, 用 git+subpath 引用避免发 7 个 repo.

  - name: frank-ask-gpt
    description: 转发给 codex CLI (gpt-5.5 Plus) — `/frank:ask:gpt <prompt>` 或 "问 gpt"
    source:
      type: git
      url: https://github.com/hutiefang76/skills-frank-bridge.git
      subpath: frank-ask-gpt
    visibility: frank-official
    target_platforms: [claude, codex]

  - name: frank-ask-claude
    description: 转发给 claude CLI (Pro/Max 订阅 opus) — `/frank:ask:claude <prompt>`
    source:
      type: git
      url: https://github.com/hutiefang76/skills-frank-bridge.git
      subpath: frank-ask-claude
    visibility: frank-official
    target_platforms: [claude, codex]

  - name: frank-ask-opencode
    description: 转发给 opencode CLI (Go 套餐 qwen3.6+) — `/frank:ask:opencode <prompt>`
    source:
      type: git
      url: https://github.com/hutiefang76/skills-frank-bridge.git
      subpath: frank-ask-opencode
    visibility: frank-official
    target_platforms: [claude, codex]

  - name: frank-ask-gemini
    description: 转发给 gemini CLI (Google) — `/frank:ask:gemini <prompt>`
    source:
      type: git
      url: https://github.com/hutiefang76/skills-frank-bridge.git
      subpath: frank-ask-gemini
    visibility: frank-official
    target_platforms: [claude, codex]

  - name: frank-mem-list
    description: 列出用户分布式记忆 (frank-memory) — `/frank:mem:list`
    source:
      type: git
      url: https://github.com/hutiefang76/skills-frank-bridge.git
      subpath: frank-mem-list
    visibility: frank-official
    target_platforms: [claude, codex]

  - name: frank-mem-search
    description: 语义检索用户分布式记忆 — `/frank:mem:search <query>`
    source:
      type: git
      url: https://github.com/hutiefang76/skills-frank-bridge.git
      subpath: frank-mem-search
    visibility: frank-official
    target_platforms: [claude, codex]

  # ───── upstream / 第三方 (anthropics / open-source) ─────

  - name: skill-creator
    description: 创建/迭代新 skill 的元 skill (anthropics 官方, 在 anthropics/skills 仓 subpath)
    source:
      type: git
      url: https://github.com/anthropics/skills.git
      subpath: skills/skill-creator
    visibility: frank-recommended
    target_platforms: [claude, codex]

  - name: superpowers
    description: 通用编程超能力 (TDD/debug/brainstorming, 社区作者 obra/superpowers — 非 anthropics)
    source:
      type: git
      url: https://github.com/obra/superpowers.git
    visibility: frank-recommended
    target_platforms: [claude]

  # ===== frank-recommended MCP (v0.4 新增, 巧妙集成: source.type=mcp 自动写 ~/.claude.json) =====

  - name: mcp-time
    description: 时间/时区 MCP server (anthropics 官方, 跨时区代码 + 日历 必备)
    source:
      type: mcp
      command: npx
      args: ["-y", "@modelcontextprotocol/server-time"]
    visibility: frank-recommended
    target_platforms: [claude, codex]

  - name: mcp-sequential-thinking
    description: 序列化思考 MCP (anthropics 官方, 让 AI 分步推理大问题)
    source:
      type: mcp
      command: npx
      args: ["-y", "@modelcontextprotocol/server-sequential-thinking"]
    visibility: frank-recommended
    target_platforms: [claude, codex]

  - name: mcp-fetch
    description: HTTP fetch MCP (uvx mcp-server-fetch, AI 真能上网拉文档)
    source:
      type: mcp
      command: uvx
      args: ["mcp-server-fetch"]
    visibility: frank-recommended
    target_platforms: [claude, codex]

  - name: mcp-context7
    description: 第三方库文档 MCP (upstash/context7, 实时拉最新 SDK 文档)
    source:
      type: mcp
      command: npx
      args: ["-y", "@upstash/context7-mcp"]
    visibility: frank-recommended
    target_platforms: [claude, codex]

  # ═══════════════════════════════════════════════════════════════
  # official — frank 项目方自研开源 skills (hutiefang76)
  #
  # 自含原则 (v0.5 加入): 每个 official skill 仓库必须**自带** 全部依赖 + setup
  # 脚本 (Python venv / npm install / 配置模板). frank install 只做"clone +
  # symlink 到 ~/.{claude,codex,opencode}/skills/", **不解析 dependencies**.
  # 这样 skills 跟项目主仓 (skills-frank) 完全解耦, 不会因私有仓 / 内部工具变化
  # 而连带破坏 frank.
  # ═══════════════════════════════════════════════════════════════

  - name: nacos-ops
    description: 'Nacos 配置中心运维 (fetch/list/push/diff/cross-diff) — Python, demo 走 frank deploy/test-stack/'
    source:
      type: git
      url: https://github.com/hutiefang76/skills-nacos-ops.git
      ref: master      # 默认分支 master, 不是 main
    visibility: frank-official

  - name: streampark-ops
    description: 'Apache StreamPark Flink 作业平台运维 (list/show/deploy) — Python, demo 走 frank deploy/test-stack/'
    source:
      type: git
      url: https://github.com/hutiefang76/skills-streampark-ops.git
      ref: main
    visibility: frank-official

  # v0.12.1: Doris OLAP 运维 — skills-doris repo 真存在 (确认 2026-05-25)
  # 仓库结构: .claude/skills/doris-ops/SKILL.md (用 subpath 引)
  - name: doris-ops
    description: 'Apache Doris OLAP 运维 (查表 / 性能 / 元数据) — Python, demo 走 frank deploy/test-stack/'
    source:
      type: git
      url: https://github.com/hutiefang76/skills-doris.git
      subpath: .claude/skills/doris-ops
    visibility: frank-official

  # ── 以下 2 个 skill 仓库还没发布 (404), 留占位等你 push 仓库后启用 ──
