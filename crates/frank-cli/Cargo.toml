[package]
name = "frank"
description = "AI toolchain governance platform: unified skill/MCP management across Claude Code, codex, opencode"
readme = "README.md"
keywords = ["cli", "ai", "skill", "mcp", "claude"]
categories = ["command-line-utilities"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "frank"
path = "src/main.rs"

[lib]
name = "frank"
path = "src/lib.rs"

# ---- 依赖 ----
# 通用依赖从 workspace 继承, 仅 CLI 专属的留这里
[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }

# CLI 解析: derive 风格, 自动生成 help/version
clap = { version = "4.6", features = ["derive", "env"] }

# YAML 解析: manifest 用 (serde_yaml 已 archived, 改用社区 fork)
serde_yml = "0.0.12"

# 终端着色: 自动处理 NO_COLOR / 重定向到文件时禁用
owo-colors = { version = "4.2", features = ["supports-colors"] }

# 表格输出: frank list 用
tabled = "0.17"

# 路径处理: 跨平台 home/config 目录定位
dirs = "6.0"

# Git 操作: vendored libgit2 + vendored openssl, 无系统依赖
git2 = { version = "0.20", default-features = false, features = [
    "vendored-libgit2",
    "vendored-openssl",
    "https",
    "ssh",
] }

# Hostname 获取: device_allowlist 校验
gethostname = "0.5"

# HTTP 客户端: 调用 frank-sync-agent REST API
# blocking 因为 frank-cli 不引入 async runtime; rustls 跨平台无系统依赖
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "webpki-roots",
    "json",
    "gzip",
    "blocking",
] }

# TOML 配置: ~/.frank/config.toml 解析 (memory sync agent URL 等)
toml = "0.8"

# frank-memory 类型复用: Scope / MemoryRecord / MemoryMatch / MemoryId
# 走 path 依赖, 不上 crates.io
frank-memory = { path = "../frank-memory" }

# frank-orchestrator 真接: P6 Milestone 1 加 `frank orchestrator demo` 子命令
# 启 tokio runtime 跑 LocalCliWorker (subprocess + stdin/stdout 包 claude/codex/opencode)
frank-orchestrator = { path = "../frank-orchestrator" }

# tokio runtime: orchestrator 子命令需要 (frank-cli 主体仍 blocking, 仅这一条 async)
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

# orchestrator providers 子命令: PATH 里查 CLI binary
which = "7.0"

# orchestrator serve (P6 M2): 本机 axum daemon + WebSocket 实时 log
axum = { version = "0.7", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
uuid = { version = "1.23", features = ["v4", "serde"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = { workspace = true }

[lints]
workspace = true
