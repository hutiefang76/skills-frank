<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>frank orchestrator — 多 AI 协作</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         margin: 0; background: #1a1a1a; color: #e0e0e0; }
  header { background: #2a2a2a; padding: 12px 20px; border-bottom: 1px solid #3a3a3a; }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header small { color: #888; }
  main { display: grid; grid-template-columns: 360px 1fr; height: calc(100vh - 50px); }
  #submit { padding: 16px; border-right: 1px solid #3a3a3a; background: #222; overflow-y: auto; }
  #submit h2 { font-size: 14px; margin: 0 0 12px; color: #bbb; text-transform: uppercase; }
  #submit label { display: block; font-size: 12px; color: #999; margin: 8px 0 4px; }
  #submit select, #submit textarea, #submit input {
    width: 100%; padding: 8px; background: #1a1a1a; color: #e0e0e0;
    border: 1px solid #3a3a3a; border-radius: 4px; font-family: inherit; font-size: 13px;
  }
  #submit textarea { min-height: 80px; resize: vertical; }
  #submit button {
    width: 100%; margin-top: 12px; padding: 10px; background: #4a8eff; color: white;
    border: none; border-radius: 4px; cursor: pointer; font-weight: 600;
  }
  #submit button:hover { background: #5a9eff; }
  #submit button:disabled { background: #555; cursor: not-allowed; }
  .jobs-section { margin-top: 24px; }
  .job-card {
    padding: 10px 12px; background: #2a2a2a; border: 1px solid #3a3a3a;
    border-radius: 4px; margin-bottom: 8px; cursor: pointer;
  }
  .job-card:hover { border-color: #4a8eff; }
  .job-card.active { border-color: #4a8eff; background: #2a3a4a; }
  .job-card .provider {
    display: inline-block; padding: 2px 6px; border-radius: 3px;
    font-size: 11px; font-weight: 600; margin-right: 6px;
  }
  .job-card .provider.claude { background: #d97706; color: #fff; }
  .job-card .provider.codex { background: #16a34a; color: #fff; }
  .job-card .provider.opencode { background: #7c3aed; color: #fff; }
  .job-card .provider.gemini { background: #2563eb; color: #fff; }
  .job-card .status {
    font-size: 11px; padding: 2px 6px; border-radius: 3px; float: right;
  }
  .status.running { background: #4a8eff; color: white; }
  .status.done { background: #16a34a; color: white; }
  .status.failed { background: #dc2626; color: white; }
  .job-card .prompt { font-size: 12px; color: #aaa; margin-top: 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #log-pane { display: flex; flex-direction: column; height: 100%; }
  #log-header { padding: 12px 20px; border-bottom: 1px solid #3a3a3a; background: #222; }
  #log-header h2 { margin: 0; font-size: 14px; color: #bbb; }
  #log-content {
    flex: 1; overflow-y: auto; padding: 12px 20px;
    font-family: "SF Mono", Menlo, Monaco, Consolas, monospace; font-size: 12px; line-height: 1.6;
  }
  .log-line { margin-bottom: 2px; white-space: pre-wrap; word-break: break-word; }
  .log-line .ts { color: #666; margin-right: 8px; }
  .log-line.error { color: #f87171; }
  .log-line.warn { color: #fbbf24; }
  .log-line.info { color: #93c5fd; }
  .log-line.debug { color: #888; }
  #stdout-block {
    margin-top: 12px; padding: 12px; background: #0a0a0a; border-radius: 4px;
    border-left: 3px solid #16a34a; white-space: pre-wrap;
  }
  #stdout-block h3 { margin: 0 0 8px; color: #16a34a; font-size: 11px; text-transform: uppercase; }
  .empty { color: #666; padding: 40px; text-align: center; font-style: italic; }

  /* v0.10.1: Tab nav + Skills view */
  .tabs { display: inline-flex; margin-left: 24px; gap: 4px; }
  .tab {
    padding: 4px 12px; background: #1a1a1a; color: #888; border: 1px solid #3a3a3a;
    border-radius: 4px; cursor: pointer; font-size: 13px;
  }
  .tab.active { background: #4a8eff; color: #fff; border-color: #4a8eff; }
  .view { display: none; height: 100%; }
  .view.active { display: grid; grid-template-columns: 360px 1fr; }
  #view-skills { display: none; height: 100%; padding: 20px; overflow-y: auto; }
  #view-skills.active { display: block; }
  #view-skills h2 { font-size: 15px; color: #bbb; margin: 0 0 12px; }
  #install-form { background: #222; padding: 16px; border-radius: 6px;
                  border: 1px solid #3a3a3a; margin-bottom: 24px; }
  #install-form .row { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 8px; align-items: end; }
  #install-form label { display: block; font-size: 11px; color: #999; margin-bottom: 4px; }
  #install-form input { width: 100%; padding: 6px 8px; background: #1a1a1a; color: #e0e0e0;
                       border: 1px solid #3a3a3a; border-radius: 3px; font-size: 13px; }
  #install-form button { padding: 7px 16px; background: #4a8eff; color: white;
                        border: none; border-radius: 3px; cursor: pointer; font-weight: 600; }
  #install-form button:hover { background: #5a9eff; }
  .skills-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .skills-table th { text-align: left; padding: 8px 10px; color: #888;
                    font-weight: 500; border-bottom: 1px solid #3a3a3a; }
  .skills-table td { padding: 8px 10px; border-bottom: 1px solid #2a2a2a; }
  .skills-table tr:hover { background: #222; }
  .vis-tag { display: inline-block; padding: 2px 6px; border-radius: 3px;
            font-size: 10px; font-weight: 600; }
  .vis-FrankOfficial    { background: #d97706; color: #fff; }
  .vis-FrankRecommended { background: #16a34a; color: #fff; }
  .vis-Community        { background: #555; color: #ccc; }
  .vis-Team             { background: #2563eb; color: #fff; }
  .vis-Private          { background: #7c3aed; color: #fff; }
  .skill-action { padding: 3px 8px; background: #2a2a2a; color: #ccc;
                  border: 1px solid #3a3a3a; border-radius: 3px; cursor: pointer;
                  font-size: 11px; margin-right: 4px; }
  .skill-action:hover { background: #3a3a3a; border-color: #4a8eff; }
  .skill-action.danger:hover { border-color: #dc2626; color: #f87171; }
  .badge-installed { color: #16a34a; font-weight: 600; }
  .badge-pending   { color: #666; }
  #skills-toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 16px;
                 background: #2a2a2a; border: 1px solid #4a8eff; border-radius: 4px;
                 display: none; z-index: 100; font-size: 13px; max-width: 400px; }
  #skills-toast.error { border-color: #dc2626; }
</style>
</head>
<body>
<header>
  <h1 style="display:inline-block;margin-right:0">frank orchestrator</h1>
  <div class="tabs" style="display:inline-flex">
    <div class="tab active" id="tab-jobs" onclick="switchView('jobs')">▶ Jobs</div>
    <div class="tab" id="tab-skills" onclick="switchView('skills')">📦 Skills</div>
    <div class="tab" id="tab-memory" onclick="switchView('memory')">🧠 Memory</div>
  </div>
</header>
<main>
<div id="view-jobs" class="view active">
  <div id="submit">
    <h2>提交新任务</h2>
    <label>① 选 CLI <span id="provider-hint" style="color:#888;font-weight:normal"></span></label>
    <select id="provider" onchange="onProviderChange()">
      <option value="">加载中...</option>
    </select>
    <label>② 选 Model <span id="model-hint" style="color:#888;font-weight:normal"></span></label>
    <select id="model">
      <option value="">(空 = 用 CLI 自家默认)</option>
    </select>
    <input id="model-input" type="text" placeholder="或手输 model 名 (留空走 CLI 默认)"
           style="margin-top:4px;display:none">
    </input>
    <label>Prompt</label>
    <textarea id="prompt" placeholder="给 AI 的指令&#10;例: 用一句话告诉我你是什么模型"></textarea>
    <label>Timeout (秒, 默认 300)</label>
    <input type="number" id="timeout" value="300" min="10" max="3600">
    <button id="submit-btn" onclick="submitJob()">▶ 提交</button>

    <div class="jobs-section">
      <h2>任务历史</h2>
      <div id="jobs-list"><div class="empty">还没有任务</div></div>
    </div>
  </div>

  <div id="log-pane">
    <div id="log-header">
      <h2 id="log-title">选择左侧任务查看日志</h2>
    </div>
    <div id="log-content"><div class="empty">← 选个任务,或提交新任务</div></div>
  </div>
</div><!-- /#view-jobs -->

<div id="view-skills">
  <h2>📦 已知 Skills <small style="color:#666;font-weight:normal" id="skills-counter"></small></h2>

  <div id="install-form">
    <div class="row">
      <div>
        <label>① Manifest name (frank-ask-gpt) 或留空走 --url</label>
        <input id="install-name" type="text" placeholder="manifest 里的 skill 名">
      </div>
      <div>
        <label>② --url (任意 git URL)</label>
        <input id="install-url" type="text" placeholder="https://github.com/foo/bar.git">
      </div>
      <div>
        <label>③ --ref (默认 main)</label>
        <input id="install-ref" type="text" placeholder="branch / tag / sha">
      </div>
      <button onclick="installSkill()">▶ Install</button>
    </div>
  </div>

  <table class="skills-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Visibility</th>
        <th>SHA</th>
        <th>Platforms</th>
        <th>Installed</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="skills-tbody">
      <tr><td colspan="6" class="empty">加载中…</td></tr>
    </tbody>
  </table>
</div><!-- /#view-skills -->

<div id="skills-toast"></div>

<div id="view-memory" style="display:none;height:100%;padding:20px;overflow-y:auto">
  <h2 style="font-size:15px;color:#bbb;margin:0 0 12px">🧠 分布式 Memory <small style="color:#666;font-weight:normal" id="memory-counter"></small></h2>

  <div id="memory-toolbar" style="background:#222;padding:14px;border-radius:6px;border:1px solid #3a3a3a;margin-bottom:20px">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr auto auto;gap:8px;align-items:end">
      <div>
        <label style="display:block;font-size:11px;color:#999;margin-bottom:4px">User scope</label>
        <input id="mem-user" type="text" placeholder="(空 = 全部)" style="width:100%;padding:6px 8px;background:#1a1a1a;color:#e0e0e0;border:1px solid #3a3a3a;border-radius:3px;font-size:13px">
      </div>
      <div>
        <label style="display:block;font-size:11px;color:#999;margin-bottom:4px">Agent scope</label>
        <input id="mem-agent" type="text" placeholder="claude / codex / ..." style="width:100%;padding:6px 8px;background:#1a1a1a;color:#e0e0e0;border:1px solid #3a3a3a;border-radius:3px;font-size:13px">
      </div>
      <div>
        <label style="display:block;font-size:11px;color:#999;margin-bottom:4px">Session scope</label>
        <input id="mem-session" type="text" placeholder="(空 = 不过滤)" style="width:100%;padding:6px 8px;background:#1a1a1a;color:#e0e0e0;border:1px solid #3a3a3a;border-radius:3px;font-size:13px">
      </div>
      <button onclick="loadMemoryList()" style="padding:7px 14px;background:#4a8eff;color:white;border:none;border-radius:3px;cursor:pointer;font-weight:600">📋 List</button>
      <button onclick="clearMemoryScope()" style="padding:7px 14px;background:#2a2a2a;color:#ccc;border:1px solid #3a3a3a;border-radius:3px;cursor:pointer">清</button>
    </div>

    <div style="display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-top:12px;padding-top:12px;border-top:1px solid #3a3a3a">
      <div>
        <label style="display:block;font-size:11px;color:#999;margin-bottom:4px">语义检索 (semantic search)</label>
        <input id="mem-query" type="text" placeholder='例: "editor preference" → 召回 "vim/emacs" 记忆' style="width:100%;padding:6px 8px;background:#1a1a1a;color:#e0e0e0;border:1px solid #3a3a3a;border-radius:3px;font-size:13px" onkeydown="if(event.key==='Enter')searchMemory()">
      </div>
      <button onclick="searchMemory()" style="padding:7px 14px;background:#16a34a;color:white;border:none;border-radius:3px;cursor:pointer;font-weight:600">🔍 Search</button>
    </div>

    <div style="display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-top:12px;padding-top:12px;border-top:1px solid #3a3a3a">
      <div>
        <label style="display:block;font-size:11px;color:#999;margin-bottom:4px">添加 raw fact (不调 LLM 抽事实)</label>
        <input id="mem-add-fact" type="text" placeholder='例: "user prefers vim over emacs"' style="width:100%;padding:6px 8px;background:#1a1a1a;color:#e0e0e0;border:1px solid #3a3a3a;border-radius:3px;font-size:13px">
      </div>
      <button onclick="addMemoryRaw()" style="padding:7px 14px;background:#d97706;color:white;border:none;border-radius:3px;cursor:pointer;font-weight:600">+ Add Raw</button>
    </div>
  </div>

  <table style="width:100%;border-collapse:collapse;font-size:13px">
    <thead>
      <tr>
        <th style="text-align:left;padding:8px 10px;color:#888;font-weight:500;border-bottom:1px solid #3a3a3a;width:90px">Short ID</th>
        <th style="text-align:left;padding:8px 10px;color:#888;font-weight:500;border-bottom:1px solid #3a3a3a">Content</th>
        <th style="text-align:left;padding:8px 10px;color:#888;font-weight:500;border-bottom:1px solid #3a3a3a;width:100px">Score</th>
        <th style="text-align:left;padding:8px 10px;color:#888;font-weight:500;border-bottom:1px solid #3a3a3a;width:140px">Created</th>
        <th style="padding:8px 10px;color:#888;font-weight:500;border-bottom:1px solid #3a3a3a;width:60px">Del</th>
      </tr>
    </thead>
    <tbody id="memory-tbody">
      <tr><td colspan="5" class="empty">点 List 加载, 或 Search 搜索. 需要 frank-sync-agent 在线 + frank login 配 token.</td></tr>
    </tbody>
  </table>
</div><!-- /#view-memory -->

</main>

<script>
let currentJobId = null;
let currentWs = null;

async function refreshJobs() {
  const r = await fetch('/jobs');
  const jobs = await r.json();
  const list = document.getElementById('jobs-list');
  if (jobs.length === 0) { list.innerHTML = '<div class="empty">还没有任务</div>'; return; }
  list.innerHTML = jobs.map(j => `
    <div class="job-card ${j.id === currentJobId ? 'active' : ''}" onclick="selectJob('${j.id}', '${j.provider}')">
      <span class="provider ${j.provider}">${j.provider}</span>
      <span class="status ${j.status}">${j.status}</span>
      <div class="prompt">${escapeHtml(j.prompt_excerpt)}</div>
    </div>
  `).join('');
}

async function selectJob(id, provider) {
  currentJobId = id;
  if (currentWs) { currentWs.close(); currentWs = null; }
  document.getElementById('log-title').textContent = `任务 ${id.slice(0, 8)} · ${provider}`;
  document.getElementById('log-content').innerHTML = '';

  // 拉一次详情 (含 stdout)
  const r = await fetch(`/jobs/${id}`);
  if (r.ok) {
    const detail = await r.json();
    if (detail.status === 'done' && detail.stdout) {
      appendStdout(detail.stdout);
    }
  }

  // 实时 WS 接 log (含历史回放)
  const wsUrl = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/jobs/${id}/stream`;
  currentWs = new WebSocket(wsUrl);
  currentWs.onmessage = (ev) => {
    const line = JSON.parse(ev.data);
    appendLog(line);
  };
  currentWs.onclose = () => { refreshJobs(); };
  refreshJobs();
}

function appendLog(line) {
  const el = document.createElement('div');
  el.className = `log-line ${line.level}`;
  const ts = new Date(line.ts).toLocaleTimeString();
  el.innerHTML = `<span class="ts">${ts}</span><span class="msg"></span>`;
  el.querySelector('.msg').textContent = line.message;
  document.getElementById('log-content').appendChild(el);
  document.getElementById('log-content').scrollTop = 1e9;
  // job done 时 fetch detail 拉 stdout
  if (line.message.includes('[job done]')) {
    fetch(`/jobs/${currentJobId}`).then(r => r.json()).then(d => {
      if (d.stdout) appendStdout(d.stdout);
    });
    refreshJobs();
  } else if (line.message.startsWith('[job failed]')) {
    refreshJobs();
  }
}

function appendStdout(text) {
  const block = document.createElement('div');
  block.id = 'stdout-block';
  block.innerHTML = '<h3>stdout</h3>';
  const pre = document.createElement('div');
  pre.textContent = text;
  block.appendChild(pre);
  document.getElementById('log-content').appendChild(block);
}

async function submitJob() {
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = '提交中…';
  try {
    const body = {
      provider: document.getElementById('provider').value,
      prompt: document.getElementById('prompt').value,
      timeout: parseInt(document.getElementById('timeout').value, 10),
    };
    const model = document.getElementById('model').value
                 || document.getElementById('model-input').value.trim();
    if (model) body.model = model;
    const resp = await fetch('/jobs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!resp.ok) {
      const text = await resp.text();
      alert(`提交失败 (${resp.status}): ${text}`);
      return;
    }
    const data = await resp.json();
    document.getElementById('prompt').value = '';
    refreshJobs();
    selectJob(data.job_id, document.getElementById('provider').value);
  } finally {
    btn.disabled = false; btn.textContent = '▶ 提交';
  }
}

// 缓存 /providers 响应, onProviderChange 时切 model 下拉
let PROVIDERS = [];

async function loadProviders() {
  try {
    const resp = await fetch('/providers');
    PROVIDERS = await resp.json();
  } catch (e) {
    PROVIDERS = [];
  }
  const select = document.getElementById('provider');
  select.innerHTML = '';
  const available = PROVIDERS.filter(p => p.available);
  if (available.length === 0) {
    const opt = document.createElement('option');
    opt.value = '';
    opt.textContent = '本机没探测到任何 CLI (装 claude/codex/opencode/gemini 之一)';
    select.appendChild(opt);
    document.getElementById('provider-hint').textContent = '';
    return;
  }
  for (const p of available) {
    const opt = document.createElement('option');
    opt.value = p.name;
    opt.textContent = `${p.name} (${p.models.length} model)`;
    select.appendChild(opt);
  }
  const unavailable = PROVIDERS.filter(p => !p.available).map(p => p.name);
  document.getElementById('provider-hint').textContent = unavailable.length
    ? `(未探测: ${unavailable.join(', ')} — 装 CLI 后刷新)`
    : '';
  onProviderChange();
}

function onProviderChange() {
  const name = document.getElementById('provider').value;
  const sel = document.getElementById('model');
  const input = document.getElementById('model-input');
  sel.innerHTML = '<option value="">(空 = 用 CLI 自家默认)</option>';
  input.style.display = 'none';
  input.value = '';
  const p = PROVIDERS.find(x => x.name === name);
  if (!p || p.models.length === 0) {
    document.getElementById('model-hint').textContent = '(无本地 model 清单, 留空用默认 或手输)';
    input.style.display = 'block';
    return;
  }
  document.getElementById('model-hint').textContent = `${p.models.length} 个本地候选`;
  for (const m of p.models) {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    sel.appendChild(opt);
  }
}

// 启动时拉
loadProviders();

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

refreshJobs();
setInterval(refreshJobs, 5000);

// ============================================================
// v0.10.1: Tab switch + Skills view
// ============================================================

function switchView(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`tab-${name}`).classList.add('active');
  document.querySelectorAll('.view, #view-skills').forEach(v => v.classList.remove('active'));
  document.getElementById(`view-${name}`).classList.add('active');
  if (name === 'skills') loadSkills();
}

function toast(msg, isError) {
  const el = document.getElementById('skills-toast');
  el.textContent = msg;
  el.className = isError ? 'error' : '';
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, isError ? 6000 : 3000);
}

async function loadSkills() {
  const tbody = document.getElementById('skills-tbody');
  tbody.innerHTML = '<tr><td colspan="6" class="empty">加载中…</td></tr>';
  try {
    const resp = await fetch('/api/skills');
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const skills = await resp.json();
    document.getElementById('skills-counter').textContent =
      ` (${skills.length} 个, ${skills.filter(s => s.installed).length} 已装)`;
    if (skills.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty">manifest 没 skills</td></tr>';
      return;
    }
    tbody.innerHTML = skills.map(s => `
      <tr>
        <td><strong>${escapeHtml(s.name)}</strong></td>
        <td><span class="vis-tag vis-${s.visibility}">${s.visibility}</span></td>
        <td><code>${escapeHtml(s.source_ref || '-')}</code></td>
        <td style="font-size:11px;color:#888">${s.platforms.join(', ') || '-'}</td>
        <td>${s.installed
            ? '<span class="badge-installed">✓ ' + (s.enabled ? 'enabled' : 'disabled') + '</span>'
            : '<span class="badge-pending">— 未装</span>'}</td>
        <td>
          ${!s.installed
            ? `<button class="skill-action" onclick="quickInstall('${escapeHtml(s.name)}')">装</button>`
            : `${s.enabled
                ? `<button class="skill-action" onclick="toggleEnable('${escapeHtml(s.name)}', false)">禁</button>`
                : `<button class="skill-action" onclick="toggleEnable('${escapeHtml(s.name)}', true)">启</button>`}
               <button class="skill-action danger" onclick="uninstallSkill('${escapeHtml(s.name)}')">卸</button>`}
        </td>
      </tr>
    `).join('');
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="6" class="empty">加载失败: ${escapeHtml(e.message)}</td></tr>`;
  }
}

async function installSkill() {
  const name = document.getElementById('install-name').value.trim();
  const url = document.getElementById('install-url').value.trim();
  const ref = document.getElementById('install-ref').value.trim();
  if (!name && !url) { toast('至少填 name 或 url', true); return; }
  const body = {};
  if (name) body.name = name;
  if (url) body.url = url;
  if (ref) body.ref = ref;
  try {
    const resp = await fetch('/api/skills', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await resp.json();
    if (data.ok) {
      toast(`✓ 装上 ${name || url}`);
      document.getElementById('install-name').value = '';
      document.getElementById('install-url').value = '';
      document.getElementById('install-ref').value = '';
      loadSkills();
    } else {
      toast(`✗ ${data.error || resp.status}`, true);
    }
  } catch (e) { toast(`✗ ${e.message}`, true); }
}

async function quickInstall(name) {
  if (!confirm(`装 ${name}?`)) return;
  document.getElementById('install-name').value = name;
  await installSkill();
}

async function uninstallSkill(name) {
  if (!confirm(`卸 ${name}? (cache 保留)`)) return;
  try {
    const resp = await fetch(`/api/skills/${encodeURIComponent(name)}`, { method: 'DELETE' });
    const data = await resp.json();
    if (data.ok) { toast(`✓ 卸 ${name}`); loadSkills(); }
    else { toast(`✗ ${data.error}`, true); }
  } catch (e) { toast(`✗ ${e.message}`, true); }
}

async function toggleEnable(name, enable) {
  const path = enable ? 'enable' : 'disable';
  try {
    const resp = await fetch(`/api/skills/${encodeURIComponent(name)}/${path}`, { method: 'POST' });
    const data = await resp.json();
    if (data.ok) { toast(`✓ ${enable ? '启用' : '禁用'} ${name}`); loadSkills(); }
    else { toast(`✗ ${data.error}`, true); }
  } catch (e) { toast(`✗ ${e.message}`, true); }
}

// ============================================================
// v0.10.3: Memory 浏览
// ============================================================

function memScopeBody() {
  const u = document.getElementById('mem-user').value.trim();
  const a = document.getElementById('mem-agent').value.trim();
  const s = document.getElementById('mem-session').value.trim();
  const out = { limit: 50 };
  if (u) out.user = u;
  if (a) out.agent = a;
  if (s) out.session = s;
  return out;
}

function clearMemoryScope() {
  document.getElementById('mem-user').value = '';
  document.getElementById('mem-agent').value = '';
  document.getElementById('mem-session').value = '';
  document.getElementById('mem-query').value = '';
}

function memTbodyEmpty(msg) {
  document.getElementById('memory-tbody').innerHTML =
    `<tr><td colspan="5" class="empty">${escapeHtml(msg)}</td></tr>`;
  document.getElementById('memory-counter').textContent = '';
}

function renderMemoryRows(records, withScore) {
  if (records.length === 0) { memTbodyEmpty('no record'); return; }
  document.getElementById('memory-counter').textContent = ` (${records.length} 条)`;
  document.getElementById('memory-tbody').innerHTML = records.map(item => {
    const r = withScore ? item.record : item;
    const score = withScore ? `${(item.score * 100).toFixed(1)}%` : '-';
    const shortId = String(r.id).slice(0, 8);
    const created = r.created_at ? new Date(r.created_at).toLocaleString() : '-';
    return `
      <tr>
        <td><code style="font-size:11px;color:#888">${escapeHtml(shortId)}…</code></td>
        <td style="white-space:pre-wrap">${escapeHtml(r.content)}</td>
        <td><span style="color:#16a34a;font-weight:600">${score}</span></td>
        <td style="font-size:11px;color:#888">${escapeHtml(created)}</td>
        <td>
          <button class="skill-action danger" onclick="deleteMemory('${escapeHtml(r.id)}')">×</button>
        </td>
      </tr>
    `;
  }).join('');
}

async function loadMemoryList() {
  memTbodyEmpty('加载中…');
  try {
    const resp = await fetch('/api/memory/list', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(memScopeBody()),
    });
    if (!resp.ok) {
      const data = await resp.json().catch(() => ({ error: `HTTP ${resp.status}` }));
      memTbodyEmpty(`加载失败: ${data.error || resp.status}`);
      return;
    }
    const records = await resp.json();
    renderMemoryRows(records, false);
  } catch (e) { memTbodyEmpty(`加载失败: ${e.message}`); }
}

async function searchMemory() {
  const q = document.getElementById('mem-query').value.trim();
  if (!q) { toast('search 框不能空', true); return; }
  memTbodyEmpty('搜索中…');
  try {
    const body = memScopeBody();
    body.query = q;
    const resp = await fetch('/api/memory/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!resp.ok) {
      const data = await resp.json().catch(() => ({ error: `HTTP ${resp.status}` }));
      memTbodyEmpty(`搜索失败: ${data.error || resp.status}`);
      return;
    }
    const matches = await resp.json();
    renderMemoryRows(matches, true);
  } catch (e) { memTbodyEmpty(`搜索失败: ${e.message}`); }
}

async function addMemoryRaw() {
  const fact = document.getElementById('mem-add-fact').value.trim();
  if (!fact) { toast('fact 框不能空', true); return; }
  try {
    const body = memScopeBody();
    body.fact = fact;
    const resp = await fetch('/api/memory/add_raw', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await resp.json();
    if (data.ok) {
      toast(`✓ 加进去了: ${fact.slice(0, 40)}…`);
      document.getElementById('mem-add-fact').value = '';
      loadMemoryList();
    } else { toast(`✗ ${data.error}`, true); }
  } catch (e) { toast(`✗ ${e.message}`, true); }
}

async function deleteMemory(id) {
  if (!confirm(`真删 ${id.slice(0, 8)}…?`)) return;
  try {
    const resp = await fetch(`/api/memory/${encodeURIComponent(id)}`, { method: 'DELETE' });
    const data = await resp.json();
    if (data.ok) { toast(`✓ 删了`); loadMemoryList(); }
    else { toast(`✗ ${data.error}`, true); }
  } catch (e) { toast(`✗ ${e.message}`, true); }
}

// switchView 增加 memory 支持
const _origSwitchView = switchView;
switchView = function(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`tab-${name}`).classList.add('active');
  document.querySelectorAll('#view-jobs, #view-skills, #view-memory').forEach(v => {
    v.classList.remove('active');
    v.style.display = 'none';
  });
  const view = document.getElementById(`view-${name}`);
  view.classList.add('active');
  view.style.display = (name === 'jobs') ? 'grid' : 'block';
  if (name === 'skills') loadSkills();
  if (name === 'memory') loadMemoryList();
};
</script>
