<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>frank orchestrator — 多 AI 协作</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         margin: 0; background: #1a1a1a; color: #e0e0e0; }
  header { background: #2a2a2a; padding: 12px 20px; border-bottom: 1px solid #3a3a3a; }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header small { color: #888; }
  main { display: grid; grid-template-columns: 360px 1fr; height: calc(100vh - 50px); }
  #submit { padding: 16px; border-right: 1px solid #3a3a3a; background: #222; overflow-y: auto; }
  #submit h2 { font-size: 14px; margin: 0 0 12px; color: #bbb; text-transform: uppercase; }
  #submit label { display: block; font-size: 12px; color: #999; margin: 8px 0 4px; }
  #submit select, #submit textarea, #submit input {
    width: 100%; padding: 8px; background: #1a1a1a; color: #e0e0e0;
    border: 1px solid #3a3a3a; border-radius: 4px; font-family: inherit; font-size: 13px;
  }
  #submit textarea { min-height: 80px; resize: vertical; }
  #submit button {
    width: 100%; margin-top: 12px; padding: 10px; background: #4a8eff; color: white;
    border: none; border-radius: 4px; cursor: pointer; font-weight: 600;
  }
  #submit button:hover { background: #5a9eff; }
  #submit button:disabled { background: #555; cursor: not-allowed; }
  .jobs-section { margin-top: 24px; }
  .job-card {
    padding: 10px 12px; background: #2a2a2a; border: 1px solid #3a3a3a;
    border-radius: 4px; margin-bottom: 8px; cursor: pointer;
  }
  .job-card:hover { border-color: #4a8eff; }
  .job-card.active { border-color: #4a8eff; background: #2a3a4a; }
  .job-card .provider {
    display: inline-block; padding: 2px 6px; border-radius: 3px;
    font-size: 11px; font-weight: 600; margin-right: 6px;
  }
  .job-card .provider.claude { background: #d97706; color: #fff; }
  .job-card .provider.codex { background: #16a34a; color: #fff; }
  .job-card .provider.opencode { background: #7c3aed; color: #fff; }
  .job-card .provider.gemini { background: #2563eb; color: #fff; }
  .job-card .status {
    font-size: 11px; padding: 2px 6px; border-radius: 3px; float: right;
  }
  .status.running { background: #4a8eff; color: white; }
  .status.done { background: #16a34a; color: white; }
  .status.failed { background: #dc2626; color: white; }
  .job-card .prompt { font-size: 12px; color: #aaa; margin-top: 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #log-pane { display: flex; flex-direction: column; height: 100%; }
  #log-header { padding: 12px 20px; border-bottom: 1px solid #3a3a3a; background: #222; }
  #log-header h2 { margin: 0; font-size: 14px; color: #bbb; }
  #log-content {
    flex: 1; overflow-y: auto; padding: 12px 20px;
    font-family: "SF Mono", Menlo, Monaco, Consolas, monospace; font-size: 12px; line-height: 1.6;
  }
  .log-line { margin-bottom: 2px; white-space: pre-wrap; word-break: break-word; }
  .log-line .ts { color: #666; margin-right: 8px; }
  .log-line.error { color: #f87171; }
  .log-line.warn { color: #fbbf24; }
  .log-line.info { color: #93c5fd; }
  .log-line.debug { color: #888; }
  #stdout-block {
    margin-top: 12px; padding: 12px; background: #0a0a0a; border-radius: 4px;
    border-left: 3px solid #16a34a; white-space: pre-wrap;
  }
  #stdout-block h3 { margin: 0 0 8px; color: #16a34a; font-size: 11px; text-transform: uppercase; }
  .empty { color: #666; padding: 40px; text-align: center; font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>frank orchestrator <small style="font-weight:normal">— 多 AI 协作 (P6 M2)</small></h1>
</header>
<main>
  <div id="submit">
    <h2>提交新任务</h2>
    <label>Provider</label>
    <select id="provider">
      <option value="codex">codex (gpt-5.5, Plus)</option>
      <option value="claude">claude (Pro / setup-token)</option>
      <option value="opencode">opencode (Go)</option>
      <option value="gemini">gemini</option>
    </select>
    <label>Prompt</label>
    <textarea id="prompt" placeholder="给 AI 的指令&#10;例: 用一句话告诉我你是什么模型"></textarea>
    <label>Timeout (秒, 默认 300)</label>
    <input type="number" id="timeout" value="300" min="10" max="3600">
    <button id="submit-btn" onclick="submitJob()">▶ 提交</button>

    <div class="jobs-section">
      <h2>任务历史</h2>
      <div id="jobs-list"><div class="empty">还没有任务</div></div>
    </div>
  </div>

  <div id="log-pane">
    <div id="log-header">
      <h2 id="log-title">选择左侧任务查看日志</h2>
    </div>
    <div id="log-content"><div class="empty">← 选个任务,或提交新任务</div></div>
  </div>
</main>

<script>
let currentJobId = null;
let currentWs = null;

async function refreshJobs() {
  const r = await fetch('/jobs');
  const jobs = await r.json();
  const list = document.getElementById('jobs-list');
  if (jobs.length === 0) { list.innerHTML = '<div class="empty">还没有任务</div>'; return; }
  list.innerHTML = jobs.map(j => `
    <div class="job-card ${j.id === currentJobId ? 'active' : ''}" onclick="selectJob('${j.id}', '${j.provider}')">
      <span class="provider ${j.provider}">${j.provider}</span>
      <span class="status ${j.status}">${j.status}</span>
      <div class="prompt">${escapeHtml(j.prompt_excerpt)}</div>
    </div>
  `).join('');
}

async function selectJob(id, provider) {
  currentJobId = id;
  if (currentWs) { currentWs.close(); currentWs = null; }
  document.getElementById('log-title').textContent = `任务 ${id.slice(0, 8)} · ${provider}`;
  document.getElementById('log-content').innerHTML = '';

  // 拉一次详情 (含 stdout)
  const r = await fetch(`/jobs/${id}`);
  if (r.ok) {
    const detail = await r.json();
    if (detail.status === 'done' && detail.stdout) {
      appendStdout(detail.stdout);
    }
  }

  // 实时 WS 接 log (含历史回放)
  const wsUrl = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/jobs/${id}/stream`;
  currentWs = new WebSocket(wsUrl);
  currentWs.onmessage = (ev) => {
    const line = JSON.parse(ev.data);
    appendLog(line);
  };
  currentWs.onclose = () => { refreshJobs(); };
  refreshJobs();
}

function appendLog(line) {
  const el = document.createElement('div');
  el.className = `log-line ${line.level}`;
  const ts = new Date(line.ts).toLocaleTimeString();
  el.innerHTML = `<span class="ts">${ts}</span><span class="msg"></span>`;
  el.querySelector('.msg').textContent = line.message;
  document.getElementById('log-content').appendChild(el);
  document.getElementById('log-content').scrollTop = 1e9;
  // job done 时 fetch detail 拉 stdout
  if (line.message.includes('[job done]')) {
    fetch(`/jobs/${currentJobId}`).then(r => r.json()).then(d => {
      if (d.stdout) appendStdout(d.stdout);
    });
    refreshJobs();
  } else if (line.message.startsWith('[job failed]')) {
    refreshJobs();
  }
}

function appendStdout(text) {
  const block = document.createElement('div');
  block.id = 'stdout-block';
  block.innerHTML = '<h3>stdout</h3>';
  const pre = document.createElement('div');
  pre.textContent = text;
  block.appendChild(pre);
  document.getElementById('log-content').appendChild(block);
}

async function submitJob() {
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = '提交中…';
  try {
    const resp = await fetch('/jobs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        provider: document.getElementById('provider').value,
        prompt: document.getElementById('prompt').value,
        timeout: parseInt(document.getElementById('timeout').value, 10),
      }),
    });
    if (!resp.ok) {
      const text = await resp.text();
      alert(`提交失败 (${resp.status}): ${text}`);
      return;
    }
    const data = await resp.json();
    document.getElementById('prompt').value = '';
    refreshJobs();
    selectJob(data.job_id, document.getElementById('provider').value);
  } finally {
    btn.disabled = false; btn.textContent = '▶ 提交';
  }
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

refreshJobs();
setInterval(refreshJobs, 5000);
</script>
</body>
</html>
