[package]
name = "frank-sync-agent"
description = "frank-sync-agent — axum 服务端 host: REST + WebSocket, 跑在 tx:8318"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "frank-sync-agent"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }

# 同 workspace 的 frank-memory crate, 走 path 依赖 (本地开发); 发版时改 version
frank-memory = { path = "../frank-memory" }

# Web framework
axum = { version = "0.7", features = ["macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "timeout"] }

# Path extractor 需要 Uuid 类型实现 (axum 通过 serde 解码)
uuid = { version = "1.23", features = ["v4", "serde"] }

# async-trait 用于 mock embedder/extractor 实现 frank-memory 的 trait (#[async_trait])
async-trait = "0.1"

# 本地 ONNX embedding (零 token). 仅在服务端用 — frank-cli release binary 不引,
# 因 fastembed 拉 onnxruntime 在某些 target (macOS x86_64, aarch64-linux) build 麻烦.
fastembed = { version = "5.13", default-features = false, features = [
    "ort-download-binaries",
    "hf-hub-rustls-tls",
] }

# block_on 给 fastembed sync API 用 (单实例 async embed 不能跨 spawn_blocking)
futures = "0.3"

# v0.11.1 用户隔离: X-Frank-Token → sha256 → tenant_id 派生 (48-bit hex), 服务端注入 Scope
sha2 = { workspace = true }
hex = "0.4"

# v0.12.0 tenant registry: SQLite (rusqlite bundled, 静态链 sqlite3 不依赖 OS).
# 用于持久化 tenants 表 (registry / quota / deletion schedule).
rusqlite = { version = "0.32", features = ["bundled"] }

# v0.12.0 retention worker 真删 qdrant points (by user_id filter, frank-memory 没暴露这个)
qdrant-client = { version = "1.18", default-features = false, features = ["serde"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
